<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      user-select: none;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* Dimmed overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    /* Hint center */
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 10, 20, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(108, 99, 255, 0.4);
      border-radius: 16px;
      padding: 20px 32px;
      text-align: center;
      color: #f0f2ff;
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: opacity 0.2s;
    }

    #hint h2 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #a89fff;
    }

    #hint p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
    }

    #hint kbd {
      background: rgba(108, 99, 255, 0.2);
      border: 1px solid rgba(108, 99, 255, 0.4);
      color: #a89fff;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
    }

    /* Selection rectangle */
    #selection {
      position: fixed;
      display: none;
      border: 2px solid #6c63ff;
      background: rgba(108, 99, 255, 0.08);
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    /* Corners accent */
    #selection::before,
    #selection::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #6c63ff;
      border-radius: 1px;
    }

    #selection::before {
      top: -3px;
      left: -3px;
    }

    #selection::after {
      bottom: -3px;
      right: -3px;
    }

    /* Size badge */
    #size-badge {
      position: fixed;
      display: none;
      background: rgba(108, 99, 255, 0.9);
      color: white;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      font-family: monospace;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* ──── Action Menu (shows after release) ──────────────────── */
    #action-menu {
      position: fixed;
      display: none;
      background: rgba(8, 10, 20, 0.96);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(108, 99, 255, 0.35);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(108, 99, 255, 0.15);
      z-index: 999;
      min-width: 260px;
      animation: menuPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes menuPop {
      from {
        transform: scale(0.85) translateY(8px);
        opacity: 0;
      }

      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .menu-title {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      padding: 4px 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-title span.sz {
      font-family: monospace;
      font-size: 10px;
      background: rgba(108, 99, 255, 0.15);
      color: #a89fff;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #e0e2ff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s;
      text-align: right;
      direction: rtl;
    }

    .menu-btn:hover {
      background: rgba(108, 99, 255, 0.18);
      color: #fff;
      transform: translateX(-2px);
    }

    .menu-btn .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .menu-btn.ocr-btn .btn-icon {
      background: rgba(108, 99, 255, 0.2);
    }

    .menu-btn.copy-btn .btn-icon {
      background: rgba(67, 230, 181, 0.15);
    }

    .menu-btn.img-btn .btn-icon {
      background: rgba(255, 166, 50, 0.15);
    }

    .menu-btn .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .menu-btn .btn-label {
      font-size: 13px;
      font-weight: 600;
    }

    .menu-btn .btn-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 1px;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
      margin: 6px 0;
    }

    .menu-btn.cancel-btn {
      color: rgba(255, 107, 107, 0.7);
      font-size: 12px;
      padding: 7px 14px;
      justify-content: center;
    }

    .menu-btn.cancel-btn:hover {
      background: rgba(255, 80, 80, 0.1);
      color: #ff6b6b;
      transform: none;
    }

    /* Cancel bottom button */
    #cancel-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 20, 20, 0.85);
      border: 1px solid rgba(255, 80, 80, 0.3);
      color: rgba(255, 107, 107, 0.7);
      padding: 7px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    #cancel-btn:hover {
      background: rgba(255, 80, 80, 0.2);
      color: #ff6b6b;
    }
  </style>
</head>

<body>
  <div id="overlay"></div>

  <div id="hint">
    <h2>✂️ تحديد المنطقة</h2>
    <p>اسحب لتحديد أي منطقة على الشاشة</p>
    <p style="margin-top:6px"><kbd>Esc</kbd> للإلغاء</p>
  </div>

  <div id="selection"></div>
  <div id="size-badge"></div>

  <!-- Action menu (shown after selection) -->
  <div id="action-menu">
    <div class="menu-title">
      <span>اختر الإجراء</span>
      <span class="sz" id="menu-size">0 × 0</span>
    </div>

    <button class="menu-btn ocr-btn" id="btn-ocr-translate">
      <div class="btn-icon">🔍</div>
      <div class="btn-text">
        <span class="btn-label">استخراج النص وترجمته</span>
        <span class="btn-sub">OCR + Translate — يقرأ النص ويترجمه تلقائياً</span>
      </div>
    </button>

    <button class="menu-btn copy-btn" id="btn-copy-image">
      <div class="btn-icon">📋</div>
      <div class="btn-text">
        <span class="btn-label">نسخ كصورة</span>
        <span class="btn-sub">ينسخ المنطقة المحددة للحافظة</span>
      </div>
    </button>

    <button class="menu-btn img-btn" id="btn-save-image">
      <div class="btn-icon">💾</div>
      <div class="btn-text">
        <span class="btn-label">حفظ كصورة</span>
        <span class="btn-sub">يحفظ المنطقة كملف PNG</span>
      </div>
    </button>

    <div class="menu-divider"></div>

    <button class="menu-btn cancel-btn" id="btn-cancel-menu">✕ إلغاء</button>
  </div>

  <button id="cancel-btn">✕ إلغاء (Esc)</button>

  <script>
    const sel = document.getElementById('selection');
    const hint = document.getElementById('hint');
    const sizeBadge = document.getElementById('size-badge');
    const actionMenu = document.getElementById('action-menu');
    const menuSize = document.getElementById('menu-size');

    let startX = 0, startY = 0, isDragging = false;
    let currentRegion = null;

    // ── Dragging ──────────────────────────────────────────────
    document.addEventListener('mousedown', (e) => {
      if (actionMenu.style.display === 'flex') return;
      startX = e.clientX; startY = e.clientY;
      isDragging = true;
      hint.style.opacity = '0';
      sel.style.display = 'block';
      sel.style.left = startX + 'px'; sel.style.top = startY + 'px';
      sel.style.width = '0'; sel.style.height = '0';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const x = Math.min(e.clientX, startX);
      const y = Math.min(e.clientY, startY);
      const w = Math.abs(e.clientX - startX);
      const h = Math.abs(e.clientY - startY);

      sel.style.left = x + 'px'; sel.style.top = y + 'px';
      sel.style.width = w + 'px'; sel.style.height = h + 'px';

      sizeBadge.style.display = 'block';
      sizeBadge.style.left = (e.clientX + 14) + 'px';
      sizeBadge.style.top = (e.clientY + 14) + 'px';
      sizeBadge.textContent = `${w} × ${h}`;
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      sizeBadge.style.display = 'none';

      const x = Math.min(e.clientX, startX);
      const y = Math.min(e.clientY, startY);
      const w = Math.abs(e.clientX - startX);
      const h = Math.abs(e.clientY - startY);

      // Too small — reset
      if (w < 10 || h < 10) {
        sel.style.display = 'none';
        hint.style.opacity = '1';
        return;
      }

      // Use window.screenX/Y to convert client coords → absolute screen coords
      currentRegion = {
        x: Math.round(x + window.screenX),
        y: Math.round(y + window.screenY),
        width: Math.round(w),
        height: Math.round(h),
        screenW: window.screen.width,
        screenH: window.screen.height
      };
      menuSize.textContent = `${Math.round(w)} × ${Math.round(h)}`;

      // Position the action menu intelligently
      const MENU_W = 270, MENU_H = 220;
      let mx = x + w + 10;
      let my = y;
      // Clamp to screen edges
      if (mx + MENU_W > screen.width) mx = Math.max(0, x - MENU_W - 5);
      if (mx + MENU_W > screen.width) mx = Math.max(0, screen.width - MENU_W - 5);
      if (my + MENU_H > screen.height) my = Math.max(0, screen.height - MENU_H - 5);

      actionMenu.style.left = mx + 'px';
      actionMenu.style.top = my + 'px';
      actionMenu.style.display = 'flex';
      actionMenu.style.flexDirection = 'column';
    });

    // ── Action Buttons ────────────────────────────────────────
    document.getElementById('btn-ocr-translate').addEventListener('click', () => {
      actionMenu.style.display = 'none';
      window.ocrAPI.sendRegion({ ...currentRegion, action: 'ocr' });
    });

    document.getElementById('btn-copy-image').addEventListener('click', () => {
      actionMenu.style.display = 'none';
      window.ocrAPI.sendRegion({ ...currentRegion, action: 'copy-image' });
    });

    document.getElementById('btn-save-image').addEventListener('click', () => {
      actionMenu.style.display = 'none';
      window.ocrAPI.sendRegion({ ...currentRegion, action: 'save-image' });
    });

    document.getElementById('btn-cancel-menu').addEventListener('click', () => {
      actionMenu.style.display = 'none';
      sel.style.display = 'none';
      hint.style.opacity = '1';
      currentRegion = null;
    });

    // ── Cancel / Escape ───────────────────────────────────────
    const cancelAll = () => window.ocrAPI.cancel();
    document.getElementById('cancel-btn').addEventListener('click', cancelAll);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancelAll(); });

    // ── Hide all UI instantly before screenshot (called from main) ──
    window.ocrAPI.onHideUI(() => {
      document.body.style.visibility = 'hidden';
    });
  </script>
</body>

</html>
