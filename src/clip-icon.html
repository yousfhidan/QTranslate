<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 44px; height: 44px;
  overflow: hidden; background: transparent;
  user-select: none;
}

#btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #6c63ff 0%, #4ecdc4 100%);
  border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow:
    0 4px 16px rgba(108,99,255,0.55),
    0 0 0 3px rgba(108,99,255,0.18),
    inset 0 1px 0 rgba(255,255,255,0.2);
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.15s ease,
              opacity 0.15s ease;
  animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  -webkit-app-region: no-drag;
  position: relative;
  overflow: hidden;
}

/* Shimmer ring */
#btn::after {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 50%;
  background: conic-gradient(
    rgba(255,255,255,0.35) 0deg,
    transparent 120deg,
    rgba(255,255,255,0.15) 240deg,
    transparent 360deg
  );
  animation: shimmer 2.5s linear infinite;
  pointer-events: none;
}

@keyframes shimmer {
  to { transform: rotate(360deg); }
}

@keyframes popIn {
  from { transform: scale(0) rotate(-30deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);   opacity: 1; }
}

#btn:hover {
  transform: scale(1.15);
  box-shadow:
    0 6px 22px rgba(108,99,255,0.75),
    0 0 0 4px rgba(108,99,255,0.25),
    inset 0 1px 0 rgba(255,255,255,0.25);
}

#btn:active {
  transform: scale(0.9);
  transition-duration: 0.08s;
}

/* Pulse ring that appears once on show */
#pulse {
  position: absolute; inset: -6px;
  border-radius: 50%;
  border: 2px solid rgba(108,99,255,0.5);
  animation: pulseRing 0.7s ease-out forwards;
  pointer-events: none;
}

@keyframes pulseRing {
  from { transform: scale(0.7); opacity: 0.8; }
  to   { transform: scale(1.6); opacity: 0; }
}
</style>
</head>
<body>
<div style="position:relative;width:44px;height:44px">
  <div id="pulse"></div>
  <button id="btn" title="ترجم النص المحدد">🌐</button>
</div>
<script>
  document.getElementById('btn').addEventListener('click', () => {
    window.clipIconAPI.translate();
  });
</script>
</body>
</html>
