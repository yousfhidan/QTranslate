directories:
  output: dist
  buildResources: build
appId: com.qtranslate.app
productName: QTranslate
copyright: QTranslate 2024
files:
  - filter:
      - main.js
      - preload.js
      - preload-popup.js
      - preload-ocr.js
      - preload-clip-icon.js
      - src/**/*
      - assets/**/*
      - node_modules/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QTranslate
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  language: '1025'
portable:
  artifactName: QTranslate-Portable.exe
electronVersion: 28.3.3
